<style>
@media (prefers-reduced-motion: no-preference) {
  .steam { animation: rise 2.2s ease-in-out infinite; }
  @keyframes rise { 0%{transform:translateY(0);opacity:.55} 50%{opacity:.9} 100%{transform:translateY(-14px);opacity:0} }
  .drip { animation: fall var(--dd,1.4s) ease-in infinite; }
  @keyframes fall { 0%{transform:translateY(0);opacity:0} 15%{opacity:1} 85%{opacity:1} 100%{transform:translateY(26px);opacity:0} }
  .pulseglow { animation: glow 2.4s ease-in-out infinite; }
  @keyframes glow { 0%,100%{opacity:.35} 50%{opacity:.75} }
  .airflow { animation: blow 1.8s linear infinite; }
  @keyframes blow { to { stroke-dashoffset: -16; } }
}
</style>
<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden">Diagram of the AquaCompute system: server heat drives a humidifier and condenser to produce freshwater, scaling with compute load</h2>
<svg width="100%" viewBox="0 0 680 700" role="img">
  <title>AquaCompute mechanism</title>
  <desc>A simulated AI server's waste heat warms saline water, which trickles through a humidifier mesh; air carries the moisture into a cold condenser coil where it drips as freshwater into a collector, with output scaling with compute load.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <linearGradient id="heatg" x1="0" y1="0" x2="0" y2="1">
      <stop id="hg1" offset="0%" stop-color="#E8593C" stop-opacity=".5"/>
      <stop id="hg2" offset="100%" stop-color="#E8593C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Server -->
  <rect id="srv-glow" x="250" y="24" width="180" height="4" fill="url(#heatg)" opacity="0"/>
  <g class="node" onclick="sendPrompt('How does the server heat drive the desalination process?')">
    <rect x="250" y="28" width="180" height="60" rx="8" fill="none" stroke="var(--t)" stroke-width="1"/>
    <line x1="266" y1="42" x2="266" y2="74" stroke="var(--t)" stroke-width="1" opacity=".3"/>
    <line x1="290" y1="42" x2="290" y2="74" stroke="var(--t)" stroke-width="1" opacity=".3"/>
    <line x1="314" y1="42" x2="314" y2="74" stroke="var(--t)" stroke-width="1" opacity=".3"/>
    <text class="th" x="340" y="52" dominant-baseline="central">AI server</text>
    <text class="ts" x="340" y="70" dominant-baseline="central">Simulated GPU load</text>
  </g>
  <g id="steamgroup" opacity="0">
    <path class="steam" d="M270 26q4 -10 0 -18" fill="none" stroke="#E8593C" stroke-width="1.5"/>
    <path class="steam" style="animation-delay:.4s" d="M300 26q4 -10 0 -18" fill="none" stroke="#E8593C" stroke-width="1.5"/>
    <path class="steam" style="animation-delay:.8s" d="M330 26q4 -10 0 -18" fill="none" stroke="#E8593C" stroke-width="1.5"/>
  </g>

  <!-- hot pipe down -->
  <line x1="340" y1="88" x2="340" y2="128" class="arr" stroke="#D05538" marker-end="url(#arrow)"/>
  <text class="ts" x="356" y="112">Hot loop</text>

  <!-- Humidifier chamber -->
  <g>
    <rect x="120" y="128" width="440" height="180" rx="14" fill="none" stroke="var(--t)" stroke-width="0.5" stroke-dasharray="4 4" opacity=".7"/>
    <text class="th" x="140" y="150">Humidifier chamber</text>
    <text class="ts" x="140" y="166">Warm water trickles over mesh</text>
    <!-- mesh -->
    <g stroke="var(--t)" stroke-width=".5" opacity=".35">
      <line x1="180" y1="200" x2="500" y2="200"/>
      <line x1="180" y1="216" x2="500" y2="216"/>
      <line x1="180" y1="232" x2="500" y2="232"/>
      <line x1="180" y1="248" x2="500" y2="248"/>
      <line x1="180" y1="264" x2="500" y2="264"/>
    </g>
    <!-- trickling water dots -->
    <circle class="drip" style="--dd:1.1s" cx="220" cy="196" r="3" fill="#3B8BD4"/>
    <circle class="drip" style="--dd:1.5s;animation-delay:.3s" cx="300" cy="196" r="3" fill="#3B8BD4"/>
    <circle class="drip" style="--dd:1.3s;animation-delay:.6s" cx="380" cy="196" r="3" fill="#3B8BD4"/>
    <circle class="drip" style="--dd:1.6s;animation-delay:.2s" cx="460" cy="196" r="3" fill="#3B8BD4"/>
    <!-- fan -->
    <g class="node" onclick="sendPrompt('What does the fan do in the humidifier chamber?')">
      <circle cx="150" cy="280" r="14" fill="none" stroke="var(--t)" stroke-width="1"/>
      <path d="M150 268v24M138 280h24" stroke="var(--t)" stroke-width="1"/>
    </g>
    <line class="airflow" x1="168" y1="280" x2="520" y2="280" stroke="var(--t)" stroke-width="1" stroke-dasharray="4 4" opacity=".5" marker-end="url(#arrow)"/>
    <text class="ts" x="200" y="296">Air absorbs water vapour</text>
  </g>

  <!-- pipe to condenser -->
  <line x1="340" y1="308" x2="340" y2="348" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="356" y="332">Humid air</text>

  <!-- Condenser chamber -->
  <g>
    <rect x="120" y="348" width="440" height="150" rx="14" fill="none" stroke="var(--t)" stroke-width="0.5" stroke-dasharray="4 4" opacity=".7"/>
    <text class="th" x="140" y="370">Condenser</text>
    <text class="ts" x="140" y="386">Cold coil condenses vapour</text>
    <path d="M180 410 Q210 400 240 410 Q270 420 300 410 Q330 400 360 410 Q390 420 420 410 Q450 400 480 410" fill="none" stroke="#3B8BD4" stroke-width="2"/>
    <circle class="drip" style="--dd:1.2s" cx="220" cy="420" r="3" fill="#3B8BD4"/>
    <circle class="drip" style="--dd:1.4s;animation-delay:.4s" cx="300" cy="420" r="3" fill="#3B8BD4"/>
    <circle class="drip" style="--dd:1.3s;animation-delay:.7s" cx="380" cy="420" r="3" fill="#3B8BD4"/>
    <circle class="drip" style="--dd:1.5s;animation-delay:.2s" cx="460" cy="420" r="3" fill="#3B8BD4"/>
  </g>

  <!-- funnel to collector -->
  <path d="M320 498 L360 498 L346 528 L334 528 Z" fill="none" stroke="var(--t)" stroke-width="1"/>
  <line x1="340" y1="528" x2="340" y2="556" stroke="var(--t)" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Collector -->
  <g clip-path="none">
    <path d="M300 556 L380 556 L372 640 Q340 652 308 640 Z" fill="none" stroke="var(--t)" stroke-width="1.5"/>
    <rect id="waterlevel" x="304" y="620" width="72" height="18" fill="#3B8BD4" opacity=".55"/>
  </g>
  <text class="th" x="340" y="672" text-anchor="middle">Freshwater collected</text>
  <text id="rate-label" class="ts" x="340" y="690" text-anchor="middle">28 mL/hr</text>
</svg>
<div style="display:flex;align-items:center;gap:12px;margin:16px 0 0">
  <span style="font-size:13px;color:var(--text-secondary);white-space:nowrap">AI compute load</span>
  <input type="range" id="load" min="0" max="100" value="35" step="1" style="flex:1" oninput="setLoad(this.value)">
  <span id="load-label" style="font-size:13px;font-weight:500;min-width:36px;text-align:right">35%</span>
</div>
<script>
function setLoad(v) {
  v = Number(v);
  document.getElementById('load-label').textContent = v + '%';
  document.getElementById('srv-glow').setAttribute('opacity', (0.15 + v/130).toFixed(2));
  document.getElementById('steamgroup').setAttribute('opacity', v > 15 ? 1 : 0);
  var rate = Math.round(8 + v * 0.55);
  document.getElementById('rate-label').textContent = rate + ' mL/hr';
  var h = Math.round(4 + v * 0.32);
  var wl = document.getElementById('waterlevel');
  wl.setAttribute('y', 638 - h);
  wl.setAttribute('height', h);
  var speed = Math.max(0.5, 1.7 - v/90);
  document.querySelectorAll('.drip').forEach(function(d){ d.style.setProperty('--dd', speed.toFixed(2)+'s'); });
}
setLoad(35);
</script>
